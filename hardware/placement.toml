# Agent-written placement for the credit-card layout (experiment Q7).
# Used by tools/pcb_sync.py ONLY when a footprint is first added (or the board is
# created). After that the .kicad_pcb is the source of truth for positions.
# Coordinates: mm, KiCad board space; rot = degrees CCW.
#
# Layout rules the agent followed (scored in docs/experiments/layout-checklist.md):
#  - ESP32-S3 antenna flush with the LEFT short edge, keep-out inside the outline
#  - USB-C mouth on the RIGHT short edge; LDO + bulk caps between USB-C and the module
#  - decoupling within ~3 mm of the pin it serves; IMU mid-board, away from the LDO
#  - JST-SH debug port on the TOP edge, buttons on the BOTTOM edge, LED near top-right
#  - passives on a 0.5 mm grid, rotations 0/90 only

[board]
# ISO/IEC 7810 ID-1 card
origin = [100.0, 100.0]
width = 85.60
height = 53.98
corner_radius = 3.18
gnd_pour_layers = ["F.Cu", "B.Cu"]

[parts]
# module, rotated so the antenna points left; body spans x 100..125.5, y 118..136
U1  = [112.75, 126.99, 90]
C3  = [108.76, 137.6, 0]     # 100n right under 3V3 pin 2 (108.76, 135.74)
C7  = [112.2, 138.4, 0]     # 10u bulk at the module
R3  = [115.5, 139.5, 90]     # EN pull-up, EN = pin 3 (110.03, 135.74)
C4  = [118.5, 139.5, 90]     # EN RC
# USB-C on the right edge, mouth right
J1  = [181.6, 126.99, 90]
R1  = [175.0, 121.0, 0]
R2  = [175.0, 133.0, 0]
# LDO block between USB and module
U2  = [166.0, 112.0, 0]
C1  = [160.5, 116.5, 0]      # 10u on VBUS (LDO in)
C2  = [173.5, 117.5, 0]      # 22u on +3V3 (LDO out)
# IMU mid-board
U3  = [146.0, 127.0, 0]
C5  = [142.8, 127.0, 90]
C6  = [149.2, 127.0, 90]
R4  = [144.0, 121.5, 0]
R5  = [148.0, 121.5, 0]
# UI
SW2 = [130.0, 148.5, 0]      # RESET, bottom edge
SW1 = [142.0, 148.5, 0]      # BOOT, bottom edge
R6  = [150.0, 104.0, 0]
D1  = [154.5, 104.0, 0]      # LED, top edge
J2  = [136.0, 103.5, 180]    # debug UART, mouth up through the top edge

[[silk]]
text = "hw-lab ESP32-S3 rev 0.1 ${GIT_HASH}"
at = [166.0, 150.0]
size = 1.0

[[silk]]
text = "RST"
at = [124.0, 148.5]

[[silk]]
text = "BOOT"
at = [136.0, 148.5]

[[silk]]
text = "GND 3V3 TX RX"
at = [136.0, 109.4]
size = 0.8

[[silk]]
text = "ANT"
at = [103.0, 126.99]
