# Atomic parts library: one symbol per orderable part.
# `tools/build_lib.py` turns this into lib/hwlab.kicad_sym, lib/hwlab.pretty/ and
# lib/3dmodels/, copying upstream KiCad library items at `upstream.tag` and baking
# in Value, Footprint, MPN, Manufacturer and LCSC. The agent picks parts by name;
# it never types a footprint or an LCSC number into the schematic.
# LCSC numbers verified against the JLCPCB parts API on 2026-11-16
# (basic = no JLC feeder fee; extended = fee per unique part).

[upstream]
tag = "10.0.8"

# ---- power symbols (not BOM items) -----------------------------------------
[[power]]
symbol = "power:GND"
[[power]]
symbol = "power:+3V3"
[[power]]
symbol = "power:VBUS"
[[power]]
symbol = "power:PWR_FLAG"

# ---- ICs / modules ------------------------------------------------------------
[[part]]
name = "ESP32-S3-WROOM-1-N8"
symbol = "RF_Module:ESP32-S3-WROOM-1"
footprint = "RF_Module:ESP32-S3-WROOM-1"
manufacturer = "Espressif"
mpn = "ESP32-S3-WROOM-1-N8"
lcsc = "C2913198"  # extended
# datasheet (ESP32-S3-WROOM-1 v1.x, table "Pin Definitions"): pad -> name; "|" = accepted aliases
datasheet_pins = { "1" = "GND", "2" = "3V3", "3" = "EN", "13" = "IO19|USB_D-", "14" = "IO20|USB_D+", "27" = "IO0", "36" = "RXD0", "37" = "TXD0", "40" = "GND", "41" = "GND" }
decap = { "3V3" = ["100n", "10u"] }
# EN (CHIP_PU) has no internal pull-up: datasheet RC = 10k to 3V3 + 1u to GND
pull = { "EN" = "10k +3V3" }

[[part]]
name = "AMS1117-3.3"
symbol = "Regulator_Linear:AMS1117-3.3"
footprint = "Package_TO_SOT_SMD:SOT-223-3_TabPin2"
manufacturer = "Advanced Monolithic Systems"
mpn = "AMS1117-3.3"
lcsc = "C6186"  # basic
datasheet_pins = { "1" = "GND|ADJ", "2" = "VO|VOUT", "3" = "VI|VIN" }  # AMS1117 SOT-223
decap = { "VI" = ["10u"], "VO" = ["22u"] }

[[part]]
# No LSM6DSO symbol upstream; LSM6DSL/LSM6DS3 share the LGA-14L pinout.
name = "LSM6DSOTR"
symbol = "Sensor_Motion:LSM6DSL"
footprint = "Package_LGA:LGA-14_3x2.5mm_P0.5mm_LayoutBorder3x4y"
manufacturer = "STMicroelectronics"
mpn = "LSM6DSOTR"
lcsc = "C2655100"  # extended
datasheet = "https://www.st.com/resource/en/datasheet/lsm6dso.pdf"
description = "iNEMO 6DoF IMU, accelerometer + gyroscope, I2C/SPI/I3C, 1.71-3.6V, LGA-14L"
pin_names = { "10" = "OCS_Aux", "11" = "SDO_Aux" }
datasheet_pins = { "1" = "SDO/SA0", "2" = "SDX", "3" = "SCX", "4" = "INT1", "5" = "VDDIO", "6" = "GND", "7" = "GND", "8" = "VDD", "9" = "INT2", "10" = "OCS_Aux", "11" = "SDO_Aux", "12" = "CS", "13" = "SCL", "14" = "SDA" }
decap = { "VDD" = ["100n"], "VDDIO" = ["100n"] }
# I2C open-drain: external pull-ups to the I/O rail ("|" = accepted values)
pull = { "SDA" = "2k2|4k7|10k +3V3", "SCL" = "2k2|4k7|10k +3V3" }

# ---- connectors / switches / LED -------------------------------------------
[[part]]
name = "USB_C_HRO_TYPE-C-31-M-12"
symbol = "Connector:USB_C_Receptacle_USB2.0_16P"
footprint = "Connector_USB:USB_C_Receptacle_HRO_TYPE-C-31-M-12"
manufacturer = "Korean Hroparts Elec"
mpn = "TYPE-C-31-M-12"
lcsc = "C165948"  # extended
# USB-C sink: Rd = 5.1k to GND on each CC pin (USB Type-C spec, sink role)
pull = { "CC1" = "5k1 GND", "CC2" = "5k1 GND" }

[[part]]
name = "JST_SH_SM04B-SRSS-TB"
symbol = "Connector_Generic_MountingPin:Conn_01x04_MountingPin"
footprint = "Connector_JST:JST_SH_SM04B-SRSS-TB_1x04-1MP_P1.00mm_Horizontal"
manufacturer = "JST"
mpn = "SM04B-SRSS-TB(LF)(SN)"
lcsc = "C160404"  # extended

[[part]]
name = "SW_TS-1187A-B-A-B"
symbol = "Switch:SW_Push"
footprint = "Button_Switch_SMD:SW_Push_1P1T_XKB_TS-1187A"
manufacturer = "XKB Connection"
mpn = "TS-1187A-B-A-B"
lcsc = "C318884"  # basic

[[part]]
name = "LED_Green_0805"
symbol = "Device:LED"
footprint = "LED_SMD:LED_0805_2012Metric"
value = "Green"
manufacturer = "Hubei KENTO Elec"
mpn = "KT-0805G"
lcsc = "C2297"  # basic
datasheet_pins = { "1" = "K", "2" = "A" }  # KiCad LED footprint: pad 1 = cathode
# polarity: anode never on GND, cathode never on a supply rail (catches a reversed low-side LED)
forbid_net = { "A" = "GND", "K" = "+3V3|VBUS" }

