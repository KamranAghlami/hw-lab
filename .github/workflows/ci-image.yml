# Builds the CI image (KiCad + KiBot + tools) and pushes it to GHCR.
# Rebuilt only when ci/Dockerfile changes, so normal runs just pull it.
name: ci-image
on:
  push:
    branches: [main]
    paths: [ci/Dockerfile, .github/workflows/ci-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ci
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hw-lab-ci:10.0.8
          cache-from: type=gha
          cache-to: type=gha,mode=max
